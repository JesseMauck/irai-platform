# Weekly: Claude Code verifies and fixes the validated QA issues, in a PR for review.
# The fix queue comes from the open `qa-fix-queue` issue, which the Railway qa service keeps current
# (app/qa/github.py). This workflow never touches the database. Secret: ANTHROPIC_API_KEY.
name: QA fixer

on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays 13:17 UTC (08:17 ET)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: qa-fixer
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Read the fix queue issue
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --label qa-fix-queue --state open --limit 1 --json body --jq '.[0].body // ""' > qa-queue.md
          if [ -s qa-queue.md ]; then echo "empty=false" >> "$GITHUB_OUTPUT"; else echo "empty=true" >> "$GITHUB_OUTPUT"; fi

      - name: Claude Code fixes validated issues
        if: steps.queue.outputs.empty == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Follow backend/app/qa/FIXER.md exactly. The fix queue is qa-queue.md at the repo root.
            Do not commit qa-queue.md.
          claude_args: "--max-turns 60"
