# When a PR with "QA-Fixes: <fingerprint>" lines merges, mark those QA issues fixed (with the PR link).
name: QA mark fixed

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  mark:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.body, 'QA-Fixes:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Mark fixed
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.QA_DATABASE_URL }}
          IRAI_AUTO_CREATE_TABLES: "0"
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          printf '%s\n' "$PR_BODY" | grep -oE '^QA-Fixes: [0-9a-f]{8,40}' | awk '{print $2}' | while read -r fp; do
            python -m app.qa mark "$fp" fixed --ref "$PR_URL"
          done
